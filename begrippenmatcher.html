<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Begrippenmatcher</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --line: #d9deea;
      --text: #1f2937;
      --muted: #6b7280;
      --ok: #d1fae5;
      --ok-border: #10b981;
      --bad: #fee2e2;
      --bad-border: #ef4444;
      --accent: #2563eb;
      --shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    .intro {
      color: var(--muted);
      margin-bottom: 20px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    button {
      border: none;
      background: var(--accent);
      color: white;
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      box-shadow: var(--shadow);
    }

    button.secondary {
      background: #374151;
    }

    .status {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow);
      min-height: 420px;
      max-height: 70vh;
      overflow-y: auto;
    }

    .panel h2 {
      margin-top: 0;
      font-size: 1.2rem;
    }

    .item-list {
      display: grid;
      gap: 14px;
    }

    .term {
      background: #eef4ff;
      border: 2px solid #bfdbfe;
      border-radius: 14px;
      padding: 14px;
      cursor: grab;
      font-weight: bold;
      user-select: none;
    }

    .term:active {
      cursor: grabbing;
    }

    .term.dragging {
      opacity: 0.55;
    }

    .dropzone {
      border: 2px dashed var(--line);
      border-radius: 14px;
      padding: 14px;
      background: #fafbff;
      transition: 0.2s ease;
      min-height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .dropzone.over {
      border-color: var(--accent);
      background: #eff6ff;
      transform: scale(1.01);
    }

    .definition {
      color: var(--text);
      line-height: 1.45;
    }

    .slot {
      min-height: 44px;
      border-radius: 10px;
      background: white;
      border: 1px solid var(--line);
      padding: 8px;
      display: flex;
      align-items: center;
    }

    .slot.empty {
      color: var(--muted);
      font-style: italic;
    }

    .dropzone.correct {
      background: var(--ok);
      border-color: var(--ok-border);
    }

    .dropzone.incorrect {
      background: var(--bad);
      border-color: var(--bad-border);
    }

    .feedback {
      margin-top: 6px;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .small {
      color: var(--muted);
      font-size: 0.92rem;
    }

    @media (max-width: 900px) {
      .board {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Begrippenmatcher</h1>
    <p class="intro">Sleep de begrippen naar de juiste definities. Klik daarna op <strong>Controleer</strong>.</p>

    <div class="toolbar">
      <button id="checkBtn">Controleer</button>
      <button id="resetBtn" class="secondary">Opnieuw</button>
    </div>

    <div class="status" id="statusBox">
      Sleep alle begrippen naar een definitie.
    </div>

    <div class="board">
      <section class="panel">
        <h2>Begrippen</h2>
        <p class="small">Deze lijst wordt automatisch door elkaar gezet.</p>
        <div class="item-list" id="termsList"></div>
      </section>

      <section class="panel">
        <h2>Definities</h2>
        <p class="small">Plaats in elk vak precies één begrip.</p>
        <div class="item-list" id="definitionsList"></div>
      </section>
    </div>
  </div>

  <script>
    const pairs = [
      { id: 1, term: 'Kwaliteitsbeheersing', definition: 'Beheersen van de kwaliteit door middel van meten, het vergelijken van meetgegevens met de gestelde eisen en het bijsturen van afwijkingen' },
      { id: 2, term: 'Kwaliteitszorg', definition: 'Alle activiteiten en maatregelen die je neemt om kwaliteit te leveren, die nodig zijn om alle facetten van een organisatie continu te optimaliseren en te verbeteren' },
      { id: 3, term: 'Kwaliteitsborging', definition: 'Alle maatregelen die je neemt om ervoor te zorgen dat je aan de eisen van de klant kunt blijven voldoen' },
      { id: 4, term: 'Kwaliteitsmanagement-systeem', definition: 'Systeem dat je bouwt om kwaliteitsbeheersing na te streven' },
      { id: 5, term: 'Kwaliteitsmanagement', definition: 'Alle activiteiten voor het besturen, beheersen en inrichten van een organisatie' },
      { id: 6, term: 'Kwaliteitskosten', definition: 'Extra kosten die je maakt om producten en diensten te leveren die voldoen aan de verwachting en eisen van de klant' },
      { id: 7, term: 'Voortbrengingsproces', definition: 'Het proces waarin alle activiteiten plaatsvinden die leiden tot de levering van het product of de dienst waar de klant aan het einde van het proces direct mee te maken heeft' },
      { id: 8, term: 'Procesmanagement', definition: 'Het beheersen en sturen van de organisatie door gebruik te maken van (informatie uit de) processen' },
      { id: 9, term: 'Organisatiestructuur', definition: 'De harde kant van de organisatie, zoals processen, prestatieindicatoren' },
      { id: 10, term: 'Organisatiecultuur', definition: 'De zachte kant van de organisatie, zoals gedrag, stijl van leidinggeven, samenwerken' }
    ];

    const termsList = document.getElementById('termsList');
    const definitionsList = document.getElementById('definitionsList');
    const statusBox = document.getElementById('statusBox');
    const checkBtn = document.getElementById('checkBtn');
    const resetBtn = document.getElementById('resetBtn');

    let placements = {};

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function createTermElement(item) {
      const div = document.createElement('div');
      div.className = 'term';
      div.draggable = true;
      div.dataset.id = item.id;
      div.textContent = item.term;

      div.addEventListener('dragstart', () => {
        div.classList.add('dragging');
      });

      div.addEventListener('dragend', () => {
        div.classList.remove('dragging');
      });

      return div;
    }

    function createDefinitionElement(item) {
      const zone = document.createElement('div');
      zone.className = 'dropzone';
      zone.dataset.id = item.id;

      const def = document.createElement('div');
      def.className = 'definition';
      def.textContent = item.definition;

      const slot = document.createElement('div');
      slot.className = 'slot empty';
      slot.textContent = 'Sleep hier een begrip naartoe';

      const feedback = document.createElement('div');
      feedback.className = 'feedback';

      zone.appendChild(def);
      zone.appendChild(slot);
      zone.appendChild(feedback);

      zone.addEventListener('dragover', (e) => {
        e.preventDefault();
        zone.classList.add('over');
      });

      zone.addEventListener('dragleave', () => {
        zone.classList.remove('over');
      });

      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('over');

        const dragged = document.querySelector('.term.dragging');
        if (!dragged) return;

        const draggedId = Number(dragged.dataset.id);
        const zoneId = Number(zone.dataset.id);

        // Verwijder oude plaatsing van dit begrip
        for (const key in placements) {
          if (placements[key] === draggedId) {
            delete placements[key];
          }
        }

        // Als hier al een begrip stond, stuur dat terug naar links
        const currentPlacedId = placements[zoneId];
        if (currentPlacedId) {
          const oldTerm = document.querySelector(`.term[data-id="${currentPlacedId}"]`);
          if (oldTerm) {
            termsList.appendChild(oldTerm);
          }
        }

        placements[zoneId] = draggedId;
        slot.classList.remove('empty');
        slot.textContent = dragged.textContent;
        dragged.remove();

        zone.classList.remove('correct', 'incorrect');
        feedback.textContent = '';
        updateStatus();
      });

      return zone;
    }

    function updateSlots() {
      document.querySelectorAll('.dropzone').forEach(zone => {
        const zoneId = Number(zone.dataset.id);
        const slot = zone.querySelector('.slot');
        const feedback = zone.querySelector('.feedback');

        if (placements[zoneId]) {
          const found = pairs.find(p => p.id === placements[zoneId]);
          slot.classList.remove('empty');
          slot.textContent = found ? found.term : '';
        } else {
          slot.classList.add('empty');
          slot.textContent = 'Sleep hier een begrip naartoe';
        }

        zone.classList.remove('correct', 'incorrect');
        feedback.textContent = '';
      });
    }

    function updateStatus(message = null) {
      const totalPlaced = Object.keys(placements).length;
      if (message) {
        statusBox.textContent = message;
      } else {
        statusBox.textContent = `${totalPlaced} van de ${pairs.length} begrippen geplaatst.`;
      }
    }

    function render() {
      placements = {};
      termsList.innerHTML = '';
      definitionsList.innerHTML = '';

      const shuffledTerms = shuffle(pairs);
      const shuffledDefinitions = shuffle(pairs);

      shuffledTerms.forEach(item => termsList.appendChild(createTermElement(item)));
      shuffledDefinitions.forEach(item => definitionsList.appendChild(createDefinitionElement(item)));

      updateStatus('Sleep alle begrippen naar een definitie.');
    }

    checkBtn.addEventListener('click', () => {
      let correct = 0;

      document.querySelectorAll('.dropzone').forEach(zone => {
        const zoneId = Number(zone.dataset.id);
        const feedback = zone.querySelector('.feedback');
        zone.classList.remove('correct', 'incorrect');

        if (!placements[zoneId]) {
          zone.classList.add('incorrect');
          feedback.textContent = 'Nog geen begrip geplaatst.';
          return;
        }

        if (placements[zoneId] === zoneId) {
          zone.classList.add('correct');
          feedback.textContent = 'Goed!';
          correct++;
        } else {
          zone.classList.add('incorrect');
          const right = pairs.find(p => p.id === zoneId);
          feedback.textContent = `Niet juist. Correct antwoord: ${right.term}`;
        }
      });

      statusBox.textContent = `Score: ${correct} van de ${pairs.length} goed.`;
    });

    resetBtn.addEventListener('click', render);

    // Klik op een geplaatst begrip om het terug te zetten naar links
    document.addEventListener('click', (e) => {
      const slot = e.target.closest('.slot');
      if (!slot) return;

      const zone = slot.closest('.dropzone');
      const zoneId = Number(zone.dataset.id);

      const placedId = placements[zoneId];
      if (!placedId) return;

      // Zoek bijbehorend begrip
      const item = pairs.find(p => p.id === placedId);
      if (!item) return;

      // Maak nieuw draggable element
      const termEl = createTermElement(item);
      termsList.appendChild(termEl);

      // Verwijder plaatsing
      delete placements[zoneId];

      // Reset visueel
      slot.classList.add('empty');
      slot.textContent = 'Sleep hier een begrip naartoe';
      zone.classList.remove('correct', 'incorrect');
      const feedback = zone.querySelector('.feedback');
      if (feedback) feedback.textContent = '';

      updateStatus();
    });
    render();
  </script>
</body>
</html>
